<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Motion com data — padrão Ótica Beira Rio</title>
<style>
  @font-face { font-family: Anton; src: url(fonts/anton-latin-400-normal.woff2); }
  @font-face { font-family: Mont; font-weight: 700; src: url(fonts/montserrat-latin-700-normal.woff2); }
  @font-face { font-family: Mont; font-weight: 800; src: url(fonts/montserrat-latin-800-normal.woff2); }
  @font-face { font-family: Mont; font-weight: 900; src: url(fonts/montserrat-latin-900-normal.woff2); }
  :root { --b1: #1450C8; --b2: #0B2E7A; --b3: #071d52; --y: #F5C518; --w: #fff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--b2); font-family: Mont, sans-serif; color: var(--w); }
  #st { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 900px;
    background: linear-gradient(0deg, rgba(7,29,82,.92) 0%, rgba(7,29,82,.55) 45%, rgba(7,29,82,0) 100%); }
  .topfade { position: absolute; left: 0; right: 0; top: 0; height: 600px; background: linear-gradient(180deg, rgba(7,29,82,.75) 0%, rgba(7,29,82,0) 100%); }
  .hook { position: absolute; left: 60px; right: 60px; top: 300px; text-align: left; }
  .hook span { display: inline-block; background: var(--y); color: var(--b2); font-family: Anton; font-size: 92px; line-height: 1.05; padding: 10px 30px 16px; border-radius: 20px; text-transform: uppercase; }
  .hook2 span { background: var(--w); font-family: Mont; font-weight: 900; font-size: 52px; padding: 16px 30px; text-transform: none; }
  .card { position: absolute; left: 50px; right: 50px; bottom: 280px; border-radius: 36px; overflow: hidden;
    background: linear-gradient(150deg, var(--b1) 0%, var(--b2) 70%); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .card .bar { background: var(--y); color: var(--b2); font-size: 38px; font-weight: 900; letter-spacing: 1px; padding: 22px 36px; }
  .card .main { padding: 26px 36px 30px; }
  .date { font-family: Anton; font-size: 118px; line-height: .95; color: var(--y); text-transform: uppercase; }
  .place { font-size: 34px; font-weight: 800; margin-top: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 26px; }
  .wa { display: flex; align-items: center; gap: 14px; font-size: 44px; font-weight: 900; }
  .wa svg { width: 58px; height: 58px; }
  .logo img { width: 230px; display: block; }
  /* end card */
  #end { position: absolute; inset: 0; background: linear-gradient(160deg, var(--b1) 0%, var(--b2) 55%, var(--b3) 100%); }
  .curve { position: absolute; left: -1230px; top: -300px; width: 1300px; height: 2600px; border-radius: 50%; border-right: 26px solid rgba(255,255,255,.95); }
  .curve2 { position: absolute; left: -1268px; top: -300px; width: 1300px; height: 2600px; border-radius: 50%; border-right: 10px solid var(--y); }
  .ec { position: absolute; left: 0; right: 0; text-align: center; }
  .cal { position: absolute; left: 50%; width: 600px; margin-left: -300px; top: 520px; background: var(--w); color: var(--b2); border-radius: 40px; overflow: hidden; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .cal .m { background: var(--y); font-family: Anton; font-size: 70px; padding: 16px 0 20px; letter-spacing: 2px; }
  .cal .n { font-family: Anton; font-size: 330px; line-height: 1; padding-top: 24px; }
  .cal .w { font-size: 56px; font-weight: 900; padding: 6px 0 38px; letter-spacing: 4px; }
  .pill { display: inline-block; background: #25d366; color: #fff; font-weight: 900; font-size: 46px; padding: 22px 44px; border-radius: 999px; }
</style>
</head>
<body>
<div id="st">
  <img id="ph">
  <div class="topfade"></div><div class="fade"></div>
  <div class="hook" id="h1"><span></span></div>
  <div class="hook hook2" id="h2"><span></span></div>
  <div class="card" id="card"></div>
  <div id="end">
    <div class="curve"></div><div class="curve2"></div>
    <div class="ec" style="top:280px;font-size:40px;font-weight:900;letter-spacing:4px">CONSULTA COM OFTALMOLOGISTA</div>
    <div class="ec" style="top:350px;font-family:Anton;font-size:110px">MARQUE NA <span style="color:var(--y)">AGENDA</span></div>
    <div class="cal"><div class="m">DEZEMBRO</div><div class="n" id="en"></div><div class="w" id="ew"></div></div>
    <div class="ec" style="top:1330px;font-size:40px;font-weight:800">Ibotirama · ao lado da <span style="color:var(--y)">Ótica Beira Rio</span></div>
    <div class="ec" style="top:1420px"><span class="pill" id="ep"></span></div>
    <div class="ec" style="top:1560px"><img src="logo_consultorio.png" style="width:300px"></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const D = q.get('d') || '12', WD = q.get('wd') || 'SÁBADO';
const V = {
  1: ['02_celular_longe', '50% 30%', 'Afasta o celular<br>pra ler? 😅', 'Pode ser vista cansada'],
  2: ['01_senhora60', '50% 30%', 'Cuide da sua visão 💙', 'Exame de vista completo'],
  3: ['05_papel', '50% 30%', 'Letra pequena<br>embaçada?', 'Passou dos 40? Faça seu exame'],
  4: ['04_consulta', '50% 35%', 'Agenda aberta 👁️', 'Consulta com oftalmologista'],
  5: ['08_casal', '50% 35%', 'Festas enxergando<br>bem ✨', 'Consulta antes do Natal'],
}[q.get('v') || '1'];
const WA = '<svg viewBox="0 0 24 24"><path fill="#25d366" d="M12 2a10 10 0 0 0-8.7 14.9L2 22l5.3-1.3A10 10 0 1 0 12 2z"/><path fill="#fff" d="M16.5 14.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.4-.3z"/></svg>';
const $ = (id) => document.getElementById(id);
$('ph').src = `../../anuncios/dez/fotos/${V[0]}.jpg`; $('ph').style.objectPosition = V[1];
$('h1').firstChild.innerHTML = V[2]; $('h2').firstChild.textContent = V[3];
$('card').innerHTML = `<div class="bar">👁️ CONSULTA COM OFTALMOLOGISTA</div><div class="main"><div class="date">${WD}, ${D}/12</div>
  <div class="place">Ibotirama · ao lado da Ótica Beira Rio</div><div class="row"><div class="wa">${WA}77 99915-7649</div><div class="logo"><img src="logo_consultorio.png"></div></div></div>`;
$('en').textContent = D; $('ew').textContent = WD; $('ep').innerHTML = 'AGENDE: 77 99915-7649';

const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const span = (t, a, b) => (t - a) / (b - a);
// timeline (ms): card visible from frame 0; hook 1 at 0.3s; hook 2 at 3.2s; end card slides in at 7.0s
window.seek = (t) => {
  const z = 1 + 0.12 * (t / 7000);
  $('ph').style.transform = `scale(${z})`;
  const a1 = ease(span(t, 300, 800)) * (1 - ease(span(t, 3000, 3300)));
  $('h1').style.opacity = a1; $('h1').style.transform = `translateX(${(1 - ease(span(t, 300, 800))) * -80}px)`;
  const a2 = ease(span(t, 3200, 3700));
  $('h2').style.opacity = a2; $('h2').style.transform = `translateX(${(1 - a2) * -80}px)`;
  const c = 1 + 0.04 * Math.sin(Math.max(0, t - 5000) / 260) * clamp(span(t, 5000, 5200)) * (1 - clamp(span(t, 6600, 6800)));
  $('card').style.transform = `scale(${c})`;
  const e = ease(span(t, 7000, 7500));
  $('end').style.transform = `translateY(${(1 - e) * 1920}px)`;
  const n = 1 + 0.06 * Math.sin(Math.max(0, t - 8000) / 220) * clamp(span(t, 8000, 8200));
  document.querySelector('.cal').style.transform = `scale(${n})`;
};
window.seek(0);
</script>
</body>
</html>
