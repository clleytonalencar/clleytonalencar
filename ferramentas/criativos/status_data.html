<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Status com data — padrão Ótica Beira Rio</title>
<style>
  @font-face { font-family: Anton; src: url(fonts/anton-latin-400-normal.woff2); }
  @font-face { font-family: Mont; font-weight: 700; src: url(fonts/montserrat-latin-700-normal.woff2); }
  @font-face { font-family: Mont; font-weight: 800; src: url(fonts/montserrat-latin-800-normal.woff2); }
  @font-face { font-family: Mont; font-weight: 900; src: url(fonts/montserrat-latin-900-normal.woff2); }
  :root { --b1: #1450C8; --b2: #0B2E7A; --b3: #071d52; --y: #F5C518; --w: #fff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Mont, sans-serif; color: var(--w); background: #000; }
  .s { position: relative; width: 1080px; height: 1920px; overflow: hidden; margin-bottom: 20px; background: var(--b2); }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shadeL { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,46,122,.82) 0%, rgba(11,46,122,.55) 34%, rgba(11,46,122,0) 58%); }
  .col { position: absolute; left: 60px; width: 440px; top: 330px; }
  .k { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 900; letter-spacing: 3px; line-height: 1.2; }
  .k .e { font-size: 54px; }
  .line { width: 120px; height: 10px; background: var(--y); border-radius: 6px; margin: 34px 0 30px; }
  .wd { font-family: Anton; font-size: 120px; line-height: .9; }
  .dd { font-family: Anton; font-size: 175px; line-height: .9; color: var(--y); }
  .mo { font-size: 27px; font-weight: 900; letter-spacing: 3px; margin-top: 18px; }
  .pl { font-size: 28px; font-weight: 700; margin-top: 10px; line-height: 1.3; }
  .pl b { color: var(--y); font-weight: 900; }
  .wap { display: inline-flex; align-items: center; gap: 12px; margin-top: 40px; background: var(--y); color: var(--b2); font-size: 36px; font-weight: 900; padding: 14px 26px; border-radius: 999px; }
  .wap svg { width: 50px; height: 50px; }
  .lg { position: absolute; left: 64px; bottom: 300px; width: 250px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const D = q.get('d') || '12', WD = q.get('wd') || 'SÁBADO';
const WA = '<svg viewBox="0 0 24 24"><path fill="#25d366" d="M12 2a10 10 0 0 0-8.7 14.9L2 22l5.3-1.3A10 10 0 1 0 12 2z"/><path fill="#fff" d="M16.5 14.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.4-.3z"/></svg>';
const col = `<div class="shadeL"></div><div class="col">
  <div class="k"><span class="e">👁️</span><span>CONSULTA COM<br>OFTALMOLOGISTA</span></div>
  <div class="line"></div>
  <div class="wd">${WD}</div><div class="dd">${D}/12</div>
  <div class="mo">DEZEMBRO · IBOTIRAMA</div>
  <div class="pl">Ao lado da <b>Ótica Beira Rio</b></div>
  <div class="wap">${WA}77 99915-7649</div></div><img class="lg" src="logo_transp.png">`;
// photo file and vertical focus (keeps faces above the card)
const P = [
  ['01_senhora60', '50% 30%'], ['02_celular_longe', '50% 30%'], ['04_consulta', '50% 35%'],
  ['05_papel', '50% 30%'], ['06_lendo_facil', '50% 35%'], ['07_crianca', '50% 30%'],
  ['08_casal', '50% 35%'], ['09_dirigindo', '50% 40%'], ['10_atendente', '50% 30%'],
];
const only = q.get('only');
document.getElementById('root').innerHTML = P.filter(([n]) => !only || n.startsWith(only)).map(([n, pos]) =>
  `<div class="s" id="s_${n}"><img class="photo" src="../../anuncios/dez/fotos/${n}.jpg" style="object-position:${pos}">${col}</div>`).join('');
</script>
</body>
</html>
